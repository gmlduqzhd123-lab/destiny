<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>명운 (命運) - 프리미엄 사주·타로</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        :root {
            /* Neo-Mystic Color Palette */
            --bg-gradient: linear-gradient(135deg, #0b0c10 0%, #1f1c2c 50%, #000000 100%);
            --gold-gradient: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f0f0;
            --text-muted: #a0a0b0;
            --theme-love: linear-gradient(135deg, rgba(255, 117, 140, 0.15), rgba(255, 126, 179, 0.05));
            --theme-money: linear-gradient(135deg, rgba(246, 211, 101, 0.15), rgba(253, 160, 133, 0.05));
            --theme-biz: linear-gradient(135deg, rgba(79, 172, 254, 0.15), rgba(0, 242, 254, 0.05));
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        /* Header / Title */
        .title-wrapper {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h2 {
            font-family: 'Noto Serif KR', serif;
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0 0 10px 0;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Glassmorphism Panel */
        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        /* Forms */
        .input-group {
            margin-bottom: 16px;
        }

        input, select {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-family: 'Pretendard', sans-serif;
        }

        input::placeholder { color: #666; }
        
        input:focus, select:focus {
            outline: none;
            border-color: #BF953F;
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 0 3px rgba(191, 149, 63, 0.2);
        }

        .flex-row { display: flex; gap: 12px; margin-bottom: 16px; }

        /* Custom Checkbox */
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        
        .checkbox-container input {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 1px solid var(--text-muted);
            border-radius: 6px;
            margin-right: 10px;
            background: rgba(0,0,0,0.3);
            padding: 0;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }

        .checkbox-container input:checked {
            background: #BF953F;
            border-color: #BF953F;
        }

        .checkbox-container input:checked::after {
            content: '✔';
            position: absolute;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--gold-gradient);
            color: #000;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(191, 149, 63, 0.5);
        }

        .btn-primary:active { transform: translateY(1px); }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: transparent;
            color: #ccc;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        /* Result Section */
        #resultSection {
            display: none;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.3rem;
            color: #FCF6BA;
            margin: 0 0 15px 0;
            text-align: center;
            letter-spacing: 1px;
        }

        .total-fortune {
            text-align: center;
            line-height: 1.7;
            font-size: 1.05rem;
            margin-bottom: 30px;
            color: #fff;
            word-break: keep-all;
        }

        /* Theme Boxes */
        .theme-box {
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        .theme-box.love { background: var(--theme-love); }
        .theme-box.money { background: var(--theme-money); }
        .theme-box.biz { background: var(--theme-biz); }

        .theme-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .theme-header.love { color: #ff9a9e; }
        .theme-header.money { color: #f6d365; }
        .theme-header.biz { color: #84fab0; }

        .score-badge {
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .theme-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e0e0e0;
            word-break: keep-all;
        }

        /* MBTI Advice */
        .mbti-section {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(0,0,0,0.5));
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center;
            margin-bottom: 40px;
        }

        .mbti-badge {
            display: inline-block;
            background: var(--gold-gradient);
            color: #000;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        /* Premium Tarot Cards */
        .tarot-wrapper {
            margin-top: 40px;
            margin-bottom: 40px;
        }
        
        .tarot-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .card-wrapper {
            width: 31%;
            aspect-ratio: 1 / 1.6;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card-wrapper.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .card-front {
            /* 신비로운 카드 뒷면(디자인상 앞면) 패턴 */
            background: radial-gradient(circle, #2a2a35 0%, #111 100%);
            border: 2px solid #BF953F;
            color: #BF953F;
        }
        
        .card-front::after {
            content: '✧';
            font-size: 2rem;
            position: absolute;
            opacity: 0.5;
        }

        .card-front span {
            z-index: 1;
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .card-back {
            background: #151520;
            transform: rotateY(180deg);
            flex-direction: column;
            border: 1px solid #BF953F;
            padding: 10px;
            text-align: center;
        }

        .card-title {
            font-family: 'Noto Serif KR', serif;
            color: #FCF6BA;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-keyword {
            color: #BF953F;
            font-size: 0.65rem;
            margin-bottom: 8px;
        }

        .card-meaning {
            font-size: 0.6rem;
            color: #ccc;
            line-height: 1.4;
            word-break: keep-all;
        }

        /* Share Button */
        .btn-share {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #FEE500;
            color: #000;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        
        .btn-share:hover { background: #E5CF00; }
    </style>
</head>
<body>

<div class="container">
    <div class="title-wrapper">
        <h2>명운 命運</h2>
        <div class="subtitle">별들의 궤적이 알려주는 당신의 오늘</div>
    </div>

    <!-- 입력 패널 -->
    <div class="panel" id="inputPanel">
        <form id="fortuneForm">
            <div class="input-group">
                <input type="text" id="userName" placeholder="이름을 입력하세요" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="number" id="birthDate" placeholder="생년월일 8자리 (예: 19980101)" required pattern="\d{8}">
            </div>
            
            <div class="flex-row">
                <select id="gender" required style="flex: 1;">
                    <option value="" disabled selected>성별 선택</option>
                    <option value="M">남성</option>
                    <option value="F">여성</option>
                </select>
                
                <select id="mbti" required style="flex: 1;">
                    <option value="" disabled selected>MBTI 선택</option>
                    <optgroup label="분석가형"><option value="INTJ">INTJ</option><option value="INTP">INTP</option><option value="ENTJ">ENTJ</option><option value="ENTP">ENTP</option></optgroup>
                    <optgroup label="외교관형"><option value="INFJ">INFJ</option><option value="INFP">INFP</option><option value="ENFJ">ENFJ</option><option value="ENFP">ENFP</option></optgroup>
                    <optgroup label="관리자형"><option value="ISTJ">ISTJ</option><option value="ISFJ">ISFJ</option><option value="ESTJ">ESTJ</option><option value="ESFJ">ESFJ</option></optgroup>
                    <optgroup label="탐험가형"><option value="ISTP">ISTP</option><option value="ISFP">ISFP</option><option value="ESTP">ESTP</option><option value="ESFP">ESFP</option></optgroup>
                </select>
            </div>
            
            <label class="checkbox-container">
                <input type="checkbox" id="rememberMe"> 
                내 정보 기기에 안전하게 기억하기
            </label>

            <button type="submit" class="btn-primary">운명의 흐름 읽기</button>
        </form>
    </div>

    <!-- 결과 렌더링 패널 -->
    <div id="resultSection">
        <div class="panel">
            <h3 class="section-title">✧ 오늘의 사주 총평 ✧</h3>
            <p id="todayFortuneText" class="total-fortune"></p>
            
            <!-- 테마별 상세 운세 -->
            <div class="theme-box love">
                <div class="theme-header love"><span>💕 애정운</span> <span class="score-badge" id="scoreLove">0점</span></div>
                <div class="theme-text" id="textLove"></div>
            </div>
            
            <div class="theme-box money">
                <div class="theme-header money"><span>💰 재물운</span> <span class="score-badge" id="scoreMoney">0점</span></div>
                <div class="theme-text" id="textMoney"></div>
            </div>
            
            <div class="theme-box biz">
                <div class="theme-header biz"><span>💼 직장운</span> <span class="score-badge" id="scoreBiz">0점</span></div>
                <div class="theme-text" id="textBiz"></div>
            </div>
        </div>

        <div class="mbti-section">
            <div id="mbtiBadge" class="mbti-badge"></div>
            <div id="mbtiAdviceText" style="font-size: 0.95rem; color: #fff; line-height: 1.5; word-break: keep-all;"></div>
        </div>
        
        <!-- 프리미엄 타로 카드 -->
        <div class="tarot-wrapper">
            <h3 class="section-title">✧ 오늘의 3카드 타로 ✧</h3>
            <p style="text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: -10px; margin-bottom: 20px;">
                (카드를 탭하여 운명을 확인하세요)
            </p>
            <div class="tarot-container" id="tarotContainer"></div>
        </div>

        <!-- 액션 버튼 영역 -->
        <button id="shareButton" type="button" class="btn-share">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            운세 결과 카톡으로 공유하기
        </button>
        
        <button id="btnReset" type="button" class="btn-secondary">초기화 및 다른 사람 운세 보기</button>
    </div>
</div>

<script>
    /**
     * Data & Engine Logic (기존 로직 유지)
     */
    const fortuneData = {

        business: [
            "당신의 아이디어가 직장이나 사업장 내에서 큰 호응을 얻을 수 있습니다. 자신 있게 의견을 내세요.",
            "협업과 팀워크가 빛을 발하는 날입니다. 동료를 돕는 것이 결국 나의 성과로 돌아옵니다.",
            "업무의 우선순위를 명확히 해야 실수를 줄일 수 있습니다. 아침에 오늘 할 일을 미리 정리해보세요."
        ],
        mbtiAdvice: {
            "INTJ": ["목표 달성도 좋지만, 과정 속의 작은 성취들도 축하할 줄 아는 여유를 가지세요."],
            "ENFP": ["특유의 긍정 에너지가 주변을 밝힙니다. 생각나는 사람이 있다면 먼저 연락해보세요."],

            "ESTP": ["특유의 임기응변 능력이 가장 빛나는 날입니다. 예상치 못한 상황을 즐기세요."]

        tarot: [
            { id: 0, name: "The Fool (바보)", keyword: "새로운 시작, 자유", meaning: "무한한 가능성을 안고 새로운 발걸음을 내딛는 시기. 두려움을 버리고 직관을 믿으세요." },
            { id: 1, name: "The Magician (마법사)", keyword: "창조력, 잠재력", meaning: "당신에게는 이미 필요한 모든 자원이 있습니다. 자신감을 가지고 계획을 실행하세요." },
            { id: 2, name: "The Empress (여황제)", keyword: "풍요, 결실", meaning: "노력과 정성이 결실을 맺는 시기입니다. 물질적, 정신적인 풍요로움을 즐기세요." },
            { id: 3, name: "The Lovers (연인)", keyword: "관계, 선택", meaning: "중요한 선택의 기로에 놓일 수 있습니다. 머리보다 가슴이 원하는 것을 선택하세요." },
            { id: 4, name: "The Hermit (은둔자)", keyword: "성찰, 내면", meaning: "외부의 소음에서 벗어나 혼자만의 시간을 가지며 내면의 목소리에 귀 기울여야 합니다." }

    function generateSeedFromString(str) {
        let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
        for (let i = 0, k; i < str.length; i++) {
            k = str.charCodeAt(i);
            h1 = h2 ^ Math.imul(h1 ^ k, 597399067); h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
            h3 = h4 ^ Math.imul(h3 ^ k, 951274213); h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
        }
        h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067); h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
        h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213); h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
        return (h1 ^ h2 ^ h3 ^ h4) >>> 0;
    }

    function createPRNG(seed) {
        return function() {
          var t = seed += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }

    function shuffleArray(array, prng) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(prng() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    const STORAGE_KEY = 'myeongun_premium_v1';
    let globalScores = { love: 0, money: 0, biz: 0 };

    function loadUserData() {
        try {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                const p = JSON.parse(savedData);
                document.getElementById('userName').value = p.name || '';
                document.getElementById('birthDate').value = p.birth || '';
                document.getElementById('gender').value = p.gender || '';
                document.getElementById('mbti').value = p.mbti || '';
                document.getElementById('rememberMe').checked = true;
            }
        } catch (e) { localStorage.removeItem(STORAGE_KEY); }
    }

    document.addEventListener('DOMContentLoaded', loadUserData);

    document.getElementById('fortuneForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('userName').value;
        const birth = document.getElementById('birthDate').value;
        const gender = document.getElementById('gender').value;
        const mbti = document.getElementById('mbti').value;
        
        if (document.getElementById('rememberMe').checked) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ name, birth, gender, mbti }));
        } else {
            localStorage.removeItem(STORAGE_KEY);
        }
        
        const today = new Date();
        const dateStr = today.getFullYear() + String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
        const uniqueString = `${name}-${birth}-${gender}-${mbti}-${dateStr}`;
        const prng = createPRNG(generateSeedFromString(uniqueString));
        
        // 렌더링
        document.getElementById('todayFortuneText').innerText = fortuneData.daily[Math.floor(prng() * fortuneData.daily.length)];
        
        globalScores.love = Math.floor(prng() * 41) + 60; 
        globalScores.money = Math.floor(prng() * 41) + 60;
        globalScores.biz = Math.floor(prng() * 41) + 60;

        document.getElementById('scoreLove').innerText = globalScores.love + '점';
        document.getElementById('scoreMoney').innerText = globalScores.money + '점';
        document.getElementById('scoreBiz').innerText = globalScores.biz + '점';

        document.getElementById('textLove').innerText = fortuneData.love[Math.floor(prng() * fortuneData.love.length)];
        document.getElementById('textMoney').innerText = fortuneData.money[Math.floor(prng() * fortuneData.money.length)];
        document.getElementById('textBiz').innerText = fortuneData.business[Math.floor(prng() * fortuneData.business.length)];
        
        const mbtiArray = fortuneData.mbtiAdvice[mbti] || ["당신의 빛나는 하루를 응원합니다!"];
        document.getElementById('mbtiBadge').innerText = mbti;
        document.getElementById('mbtiAdviceText').innerText = mbtiArray[Math.floor(prng() * mbtiArray.length)];
        
        const shuffledDeck = shuffleArray(fortuneData.tarot, prng).slice(0, 3);
        const tarotContainer = document.getElementById('tarotContainer');
        tarotContainer.innerHTML = ''; 
        
        shuffledDeck.forEach((card, index) => {
            const labels = ["과거", "현재", "미래"];
            tarotContainer.innerHTML += `
                <div class="card-wrapper" onclick="this.classList.toggle('flipped')">
                    <div class="card-inner">
                        <div class="card-front"><span>${labels[index]}</span></div>
                        <div class="card-back">
                            <div class="card-title">${card.name}</div>
                            <div class="card-keyword">[${card.keyword}]</div>
                            <div class="card-meaning">${card.meaning}</div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        const resultSection = document.getElementById('resultSection');
        resultSection.style.display = 'block';
        
        // 부드러운 스크롤 (폼 패널은 숨기지 않고 아래로 스크롤만 함)
        setTimeout(() => {
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    });

    // 리셋 기능 추가 (30년차 디자이너의 UX 배려)
    document.getElementById('btnReset').addEventListener('click', function() {
        // 폼 초기화
        document.getElementById('fortuneForm').reset();
        
        // 로컬 스토리지 삭제
        localStorage.removeItem(STORAGE_KEY);
        
        // 결과창 숨기기
        document.getElementById('resultSection').style.display = 'none';
        
        // 최상단으로 스크롤
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('shareButton').addEventListener('click', async () => {
        const name = document.getElementById('userName').value;
        const mbti = document.getElementById('mbti').value;
        const currentUrl = window.location.href; 
        
        const shareText = `🔮 ${name}(${mbti})님의 오늘 사주·운세 🔮\n\n💕 애정운: ${globalScores.love}점\n💰 재물운: ${globalScores.money}점\n💼 직장운: ${globalScores.biz}점\n\n내 운세 점수와 프리미엄 타로 카드도 무료로 확인해보세요!\n👉 `;

        if (navigator.share) {
            try { await navigator.share({ title: `[명운] ${name}님의 운세`, text: shareText, url: currentUrl }); } 
            catch (error) { if (error.name !== 'AbortError') fallbackToClipboard(shareText + currentUrl); }
        } else {
            fallbackToClipboard(shareText + currentUrl);
        }
    });

    async function fallbackToClipboard(text) {
        try {
            await navigator.clipboard.writeText(text);
            alert('결과가 복사되었습니다! 원하는 곳에 붙여넣기(Ctrl+V) 해주세요.');
        } catch (err) { alert('공유 기능을 지원하지 않는 환경입니다.'); }
    }
</script>
</body>
</html>
