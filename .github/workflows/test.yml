# 별빛 나침반 자동 검사: PR과 main 푸시마다 계산 테스트와 화면 흐름 테스트를 실행합니다.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Playwright 1.56은 Ubuntu 26.04를 지원하지 않아 실행 환경을 24.04로 고정합니다.
    # (Playwright를 올릴 때 함께 ubuntu-latest로 되돌릴 수 있습니다.)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 개인정보 회귀 테스트가 예전 커밋과 결과를 비교합니다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 계산·개인정보 단위 테스트
        run: npm test
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 화면 흐름(E2E) 테스트
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
